<!DOCTYPE html>

<html>

<head>

<title>CSS Selectors</title>

<style>

p { color: blue; }

#heading { color: red; }

.note { background-color: yellow; }

</style>

</head>

<body>

<h1 id="heading">CSS Selectors</h1>

<p>This is an element selector.</p>

<p class="note">This is a class

selector.</p>

</body>

</html>
